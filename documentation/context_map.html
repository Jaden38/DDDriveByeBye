<style>
body { margin: 0; padding: 24px; background: #1a1a1e; }
#ctx-map { max-width: 900px; margin: 0 auto; }
h1 { font-family: 'Segoe UI', sans-serif; color: #e0e0e0; font-size: 20px; font-weight: 500; text-align: center; margin-bottom: 24px; }
</style>

<h1>Context Map — Plateforme de mobilité VTC & Covoiturage</h1>
<div id="ctx-map"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

await document.fonts.ready;

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Segoe UI", sans-serif',
  themeVariables: {
    darkMode: true,
    fontSize: '13px',
    primaryColor: '#2d2d35',
    primaryTextColor: '#e0e0e0',
    primaryBorderColor: '#555',
    lineColor: '#888',
    secondaryColor: '#252530',
    tertiaryColor: '#1e1e26',
    background: '#1a1a1e',
    mainBkg: '#2d2d35',
    nodeBorder: '#666',
    clusterBkg: '#22222a',
    clusterBorder: '#444',
    titleColor: '#e0e0e0',
    edgeLabelBackground: '#2d2d35',
    textColor: '#e0e0e0',
    noteTextColor: '#ccc',
    noteBkgColor: '#2a2a32',
    noteBorderColor: '#555',
  },
  flowchart: {
    curve: 'basis',
    padding: 20,
    nodeSpacing: 60,
    rankSpacing: 80,
    htmlLabels: true,
  }
});

const diagram = `
flowchart TB
    TC["<b>Territorial Configuration</b><br/><i>Rules, regulations, zones</i>"]
    UM["<b>User Management</b><br/><i>Profiles, vehicles, availability</i>"]
    MA["<b>Matching</b><br/><i>Correspondance, grouping</i>"]
    GE["<b>Geolocation & Routing</b><br/><i>Position, ETA, routing</i>"]
    RM["<b>Ride Management</b><br/><i>Trip lifecycle, state machine</i>"]
    PR["<b>Pricing</b><br/><i>Dynamic pricing, promos</i>"]
    RE["<b>Reputation</b><br/><i>Ratings, penalties</i>"]
    PA["<b>Payment</b><br/><i>Transactions, refunds</i>"]
    NO["<b>Notification</b><br/><i>Alerts, communications</i>"]

    MA -- "Conformist" --> TC
    MA -- "Conformist" --> GE
    MA -- "Customer-Supplier" --> UM
    PR -- "Conformist" --> GE
    PR -- "Conformist" --> TC
    RM -- "Customer-Supplier" --> MA
    RM -- "Customer-Supplier" --> PR
    RM -- "Customer-Supplier" --> PA
    RM -- "Partnership" --> RE
    RE -- "Customer-Supplier" --> UM
    RM -. "Published Language /<br/>Open Host Service" .-> NO

    style TC fill:#3a3520,stroke:#a08c3e,color:#f0e6b8
    style UM fill:#1a3530,stroke:#2e8b6e,color:#a8e6d0
    style MA fill:#2a2040,stroke:#7b68ae,color:#d4c8f0
    style GE fill:#1a2a40,stroke:#4682b4,color:#b0d4f1
    style RM fill:#3a2020,stroke:#c75a3a,color:#f5c4b3,stroke-width:2px
    style PR fill:#1e3218,stroke:#5a9e34,color:#c0dd97
    style RE fill:#35182a,stroke:#a0466e,color:#f0b8d0
    style PA fill:#301818,stroke:#a03030,color:#f5b0b0
    style NO fill:#28282e,stroke:#777,color:#ccc

    linkStyle 0 stroke:#a08c3e,stroke-width:1.5px
    linkStyle 1 stroke:#4682b4,stroke-width:1.5px
    linkStyle 2 stroke:#2e8b6e,stroke-width:1.5px
    linkStyle 3 stroke:#4682b4,stroke-width:1.5px
    linkStyle 4 stroke:#a08c3e,stroke-width:1.5px
    linkStyle 5 stroke:#7b68ae,stroke-width:1.5px
    linkStyle 6 stroke:#5a9e34,stroke-width:1.5px
    linkStyle 7 stroke:#a03030,stroke-width:1.5px
    linkStyle 8 stroke:#a0466e,stroke-width:1.5px
    linkStyle 9 stroke:#2e8b6e,stroke-width:1.5px
    linkStyle 10 stroke:#777,stroke-width:1.5px,stroke-dasharray:5 5
`;

const { svg } = await mermaid.render('ctx-svg', diagram);
document.getElementById('ctx-map').innerHTML = svg;

// round box corners
document.querySelectorAll('#ctx-map .node rect, #ctx-map .node polygon').forEach(el => {
  if (el.tagName === 'polygon') {
    const parent = el.parentNode;
    const bbox = el.getBBox();
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', bbox.x);
    rect.setAttribute('y', bbox.y);
    rect.setAttribute('width', bbox.width);
    rect.setAttribute('height', bbox.height);
    rect.setAttribute('rx', '10');
    for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (el.hasAttribute(a)) rect.setAttribute(a, el.getAttribute(a));
    }
    el.replaceWith(rect);
  } else {
    el.setAttribute('rx', '10');
  }
});
</script>
